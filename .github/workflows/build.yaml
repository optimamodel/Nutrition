name: Build & Push Docker image to GHCR

on:
  push:
    branches:
      - '**'           # build & push on every branch
  workflow_dispatch:   # allow manual runs

# Needed so GITHUB_TOKEN can publish to GHCR
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Docker image name will be ghcr.io/<owner>/<repo>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      # one build per branch at a time (avoids cache thrash)
      group: build-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch; safe to keep even if you target linux/amd64 only)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive tags+labels. This handles branch name sanitization automatically.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag by branch, e.g. myfeature → :myfeature
            type=ref,event=branch
            # Tag by short commit, e.g. :sha-abc1234
            type=sha,format=short,prefix=sha-
            # Tag the default branch as :latest in addition to its branch name
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created={{date 'YYYY-MM-DDTHH:mm:ssZ'}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          # context defaults to repository root (where your Dockerfile is)
          context: .
          file: ./Dockerfile
          push: true
          # Choose the platforms you need. If you're only targeting linux/amd64 on Azure,
          # you can set platforms: linux/amd64 to speed things up.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max